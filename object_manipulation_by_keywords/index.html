<!DOCTYPE html>
<html>
<title>{Название задания}</title>
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<script>
    var mesh = document.getElementById('model');
    document.addEventListener("DOMContentLoaded", () => {
        mesh = document.getElementById('model').object3D;
        document.body.addEventListener('keydown', keyPressed);
        console.log(mesh);
        function keyPressed(e) {
            let key = e.key;
            if (key == 'ArrowUp') {
                mesh.rotateX(-0.1);
            }
            if (key == 'ArrowDown') {
                mesh.rotateX(-0.1);
            }
            if (key == 'ArrowLeft') {
                mesh.rotateY(-0.1);
            }
            if (key == 'ArrowRight') {
                mesh.rotateY(-0.1);
            }
        }
    })        
</script>

<body style="margin : 0px; overflow: hidden;">
    <a-scene shadow="autoUpdate: true" embedded vr-mode-ui="enabled: false;" arjs
        renderer="logarithmicDepthBuffer: true;">
        <a-assets>
            <a-asset-item id="model" src="./src/shadow.glb"></a-asset-item>
        </a-assets>

        <a-marker id="marker" preset="kanji">

            <a-entity>
                <a-plane color="grey" rotation="90 0 0" position="0 0 0" width="1" height="1"
                    shadow="receive:true; cast:false" material="side:double"></a-plane>

                <a-entity id='model' scale="0.25 0.25 0.25" gltf-model="#model" color="red" position="0 2 0"
                    shadow></a-entity>

                <a-entity light="castShadow: true; type:point" color="white" position="0 5 0"></a-entity>
            </a-entity>
        </a-marker>
        <a-entity camera></a-camera>
        </a-entity>
    </a-scene>
</body>

</html>
