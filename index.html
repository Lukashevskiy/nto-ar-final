<!DOCTYPE html>
<html>
   <title>Трехмерные фигуры на гранях куба
   </title>
   <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
   <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
   <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
   <body style="margin : 0px; overflow: hidden;">
        <script>
            AFRAME.registerComponent('opacity', {
                init: function(){
                    var el = this.el;
                    this.el.addEventListener('model-loaded', function (e) {
                        console.log(el.object3D.children[0].children[0].material.opacity)
                        el.object3D.children[0].children.forEach(element => {
                            element.material.opacity = 0.5
                        })
                    })

                }
            })
        </script>
       <a-scene
           embedded
           vr-mode-ui="enabled: false;"
           arjs="trackingMethod: best; debugUIEnabled: false;"
           renderer="logarithmicDepthBuffer: true;"
       >
           <a-assets>
               <a-asset-item id="pr1" src="./primitives1.glb" />
               <a-asset-item id="pr2" src="./primitives2.glb" />
               <a-asset-item id="pr3" src="./primitives3.glb" />
               <a-asset-item id="pr4" src="./primitives4.glb" />
               <a-asset-item id="pr5" src="./primitives5.glb" />
               <a-asset-item id="tree-obj" src="./primitives.obj"></a-asset-item>
               <a-asset-item id="tree-mtl" src="./primitives.mtl"></a-asset-item>
              
           </a-assets>
           <a-marker id="marker_1" preset="kanji">
                   <!-- <a-entity rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#pr1" material="alphaTest:0.5; "></a-entity> -->

                    <a-obj-model src="#tree-obj" mtl="#tree-mtl" opacity ></a-obj-model>

                   <!-- <a-entity rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#pr2" opacity="0.5"></a-entity> -->
                   <!-- <a-entity rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#pr3" opacity="0.5"></a-entity> -->
                   <!-- <a-entity rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#pr4" opacity="0.5"></a-entity> -->
                   <!-- <a-entity rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#pr5" opacity="0.5"></a-entity>                -->
           </a-marker>

           <a-entity camera></a-camera>
       </a-scene>
   </body>

</html>
