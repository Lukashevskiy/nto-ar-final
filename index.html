<!DOCTYPE html>
<html>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <body>
   <script>
    AFRAME.registerComponent('follow', {
        schema: {
         t1: {
           type: "selector",
         },
         t2: {
           type: "selector",
         },
         speed: { type: 'number' }
        },

        init: function () {
            this.targets = [this.data.t1.object3D, this.data.t2.object3D];
        },

        update: function(){
            this.fromPosition = this.targets[0].position;
            this.toPosition = this.targets[1].position;
        },

        tick: function (time, timeDelta) {           
            
            var t = Math.abs((time*0.001)%2-1);
            t = Math.min(t,0.98);
            t = Math.max(t,0.02);
            
            let inter =  new THREE.Vector3();  
          
            inter.add(this.fromPosition);
            inter.add(this.toPosition);
            inter.multiplyScalar(0.7);    
            inter.y += 5;
          
            inter.multiplyScalar(t*(1-t));
            

            startPosition = new THREE.Vector3();
            startPosition.add(this.fromPosition);
            startPosition.multiplyScalar(t*t);
            
            stopPosition = new THREE.Vector3();
            stopPosition.add(this.toPosition);
            stopPosition.multiplyScalar((1-t)*(1-t));
            
            currentPosition = new THREE.Vector3();
            currentPosition.add(startPosition);
            currentPosition.add(stopPosition);

            currentPosition.add(inter)
            
            this.el.setAttribute('position', currentPosition);
        }
     });

   </script>
   <a-scene embedded
            ar
            vr-mode-ui="enabled:false;"
            arjs="trackingMethod:best; sourceType: webcam"
            renderer="logarithmicDepthBuffer:true;"> 

        <a-entity>
            <a-marker type='pattern' url='trackers/letterA.patt'>
                <a-sphere radius="0" id="t1" color="red" position="1 0 -3"></a-sphere>
            </a-marker> 
            
            <a-marker type='pattern' url='trackers/letterB.patt'>
                <a-sphere radius="0" id="t2" color="yellow" position="0 0 -3"></a-sphere>
            </a-marker>
            
            <a-sphere radius="0.25" follow="t1: #t1; t2:#t2; speed: 1" color="blue" position="0 0.2 -3"></a-sphere>
        </a-entity>

        <a-entity camera></a-entity> 
   </a-scene>
 </body>

</html>
