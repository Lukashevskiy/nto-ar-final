<!DOCTYPE html>
<html>
   <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

 
  <body>
    <script>
      AFRAME.registerComponent('follow', {
        schema: {

          target: {
            type: "selector"
          },

        },
        init: function () {
          this.target = this.data.target;
        },

        update: function(){
        //   this.object3D.rotation = this.sceneEl.object3D.rotation;
          this.toPosition = this.target.position;
        },

        tick: function(time, timeDelta) {     
        //   this.currentPosition.set(0, 0, 0);
          currentPosition = new THREE.Vector3(this.toPosition);

          let inter =  new THREE.Vector3( );  
          
          inter.add(currentPosition);
          inter.multiplyScalar(0.7);    
          inter.y += 5;
          
          var t = Math.abs((time*0.001)%2-1);
          t = Math.min(t,0.98);
          t = Math.max(t,0.02);
          
          inter.multiplyScalar(t*(1-t));
          
          
          currentPosition.multiplyScalar(t*t);


          let offset = currentPosition;

          this.el.setAttribute('position', {
            x:  offset.x + inter.x,
            y:  offset.y + inter.y,
            z:  offset.z + inter.z
          });
        },
      });

    </script>
    <a-scene>    
      <a-entity>
      <a-marker preset="hiro">
        <a-sphere radius="0" id="target-box1" color="red" position="0 0 0"></a-sphere>
        <a-sphere radius="0.25" follow="target: #target-box1;" color="blue" position="0 0.2 0"></a-sphere>
      </a-marker>
      <a-entity camera></a-entity>
    </a-entity>
    </a-scene>
  </body>

</html>
