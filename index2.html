<!DOCTYPE html>
<html>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <!-- <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script> -->

 
  <body>
    <script>
      AFRAME.registerComponent('follow', {
        schema: {

          t1: {
            type: "selector"
          },

        },
        init: function () {
          this.target = this.data.t1.object3D;
        },

        update: function(){
          this.toPosition = this.target.position;
        },

        tick: function(time, timeDelta) {     

          var t = Math.abs((time*0.001)%2-1);
          t = Math.min(t,0.98);
          t = Math.max(t,0.02);
          
          
          let inter =  new THREE.Vector3( );  
          inter.add(this.toPosition);
          inter.multiplyScalar(0.7);    
          inter.y += 5;
          
          inter.multiplyScalar(t*(1-t));
          
          
          offset = new THREE.Vector3()
          offset.add(this.toPosition);
          
          offset.multiplyScalar(t*t)
          
          offset.add(inter);

          
          this.el.setAttribute('position', offset);
        },
      });

    </script>
    <a-scene>    
      <a-entity>
      <!-- <a-marker preset="hiro"> -->
        <a-sphere radius="0" id="t1" position="0 0 0"></a-sphere>
        <a-sphere radius="0.25" follow="t1: #t1;" color="blue" position="0 0.2 0"></a-sphere>
      <!-- </a-marker> -->
      <!-- <a-entity camera></a-entity> -->
    </a-entity>
    </a-scene>
  </body>

</html>
