<!DOCTYPE html>
<html>
   <title>Трехмерные фигуры на гранях куба
   </title>
   <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
   <!-- <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script> -->
   <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
   <body style="margin : 0px; overflow: hidden;">
    <script>
            AFRAME.registerComponent('my_shader', {

                init: function() {
                    const geo = new THREE.BoxGeometry(1,1, 1)
                    const mat = new THREE.MeshLambertMaterial({ color:0xff0000})

                    const edges = new THREE.EdgesGeometry(geo)
                    mesh2 = new THREE.LineSegments(edges,
                        this.el.sceneEl.getObject3D('mesh'));
                    // mesh2.position.z = -4
                    this.el.setObject3D('mesh', mesh2);
                }
            })
    </script>
       <a-scene>
           <!-- embedded
           vr-mode-ui="enabled: false;"
           arjs="trackingMethod: best; debugUIEnabled: false;"
           renderer="logarithmicDepthBuffer: true;"
       > -->
           
                    <a-box color="red" my_shader></a-box>
         
                   <!-- <a-entity rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#pr2" opacity="0.5"></a-entity> -->

                   <!-- <a-entity rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#pr5" opacity="0.5"></a-entity>                -->
           <!-- </a-marker> -->

           <!-- <a-entity camera></a-camera> -->
       </a-scene>
   </body>

</html>
