<!DOCTYPE html>
<html>
    <title>{Название задания}</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <body style="margin : 0px; overflow: hidden;">
        <a-scene
            embedded
            vr-mode-ui="enabled: false;"
            arjs="trackingMethod: best; debugUIEnabled: false;"
            renderer="logarithmicDepthBuffer: true;">

        <a-marker preset="custom" type="pattern" url="./src/markers/patt/letterA.patt">
            <a-cylinder radius="0.7" src="./src/media/tiles.png" material="side:back " position="0 -0.5 0">
            <a-ring material="blending:subtractive"  radius-outer="2" rotation="-90 0 0" position="0 1.1 0"></a-cirlce>
         </a-marker>

        <a-entity camera></a-entity>
        </a-scene>
    </body>

</html>
